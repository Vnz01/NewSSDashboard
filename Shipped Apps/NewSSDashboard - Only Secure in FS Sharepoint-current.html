  SyncClient.prototype.setupChannel = function () {
    if (typeof global.BroadcastChannel !== 'function') return;
    var self = this;
    this.channel = new global.BroadcastChannel(this.channelName);
    this.channel.onmessage = function (event) {

      if (!message || message.sender === self.leaderId) return;
      if (message.type === 'deltas') self.applyBroadcastDeltas(message.payload);
      if (message.type === 'activity') self.activeUntil = Math.max(self.activeUntil, Date.now() + 30000);
      if (message.type === 'hello' && self.isLeader) {
        self.broadcast('deltas', { source: 'leader', upserts: self.getRecords(), deletes: [] });

  SyncClient.prototype.broadcast = function (type, payload) {
    if (!this.channel) return;
    try { this.channel.postMessage({ type: type, payload: payload, sender: this.leaderId }); } catch (_) {}
  };

  SyncClient.prototype.decorateRecord = function (record, operationId) {
    var output = clone(record) || {};
    output._forgeSync = Object.assign({}, output._forgeSync || {}, {
      clientId: this.clientId,
      operationId: operationId,
      runtimeVersion: VERSION

  };

  SyncClient.prototype.parseItem = function (item) {
    var data;
    try { data = JSON.parse(item.DataJson || '{}'); } catch (_) { return null; }
    return {
      id: String(this.getRecordId(data)),
      data: data,
      spId: Number(item.Id),
      etag: itemEtag(item),
      modified: String(item.Modified || ''),
      base: clone(data)

  };

  SyncClient.prototype.buildItemsUrl = function (full) {
    var select = '$select=Id,Title,ItemType,DataJson,Modified';
    var query = select;
    if (!full && this.watermark) {
      var overlap = new Date(Math.max(0, Date.parse(this.watermark) - this.config.watermarkOverlapMs)).toISOString();
      query += "&$filter=Modified ge datetime'" + odataEscape(overlap) + "'";
    }
    query += '&$orderby=Modified asc,Id asc&$top=5000';
    return this.listUrl() + '/items?' + query;
  };

  SyncClient.prototype.fetchPagedItems = async function (url) {
    var items = [];

    while (next) {
      var result = await this.request(next);
      items = items.concat(results(result.payload));
      next = nextLink(result.payload);
    }
    return items;
  };

  SyncClient.prototype.applyItems = function (items, source, full) {
    var upserts = [];
    var deletes = [];

      if (item.ItemType !== self.itemType || !item.DataJson) return;

      var version = parsed.spId + '|' + parsed.modified + '|' + parsed.etag;
      if (self.seenVersions.get(parsed.id) === version) return;
      self.seenVersions.set(parsed.id, version);

        deletes.push(parsed.id);

        upserts.push(clone(parsed.data));

      Array.from(this.records.keys()).forEach(function (id) {

          self.records.delete(id);
          deletes.push(id);

    }
    if (maxModified) this.watermark = maxModified;
    if (upserts.length || deletes.length) {
      this.activeUntil = Date.now() + 30000;

  };

  SyncClient.prototype.applyBroadcastDeltas = function (change) {
    if (!change) return;
    var self = this;
    (change.upserts || []).forEach(function (record) {
      var id = String(self.getRecordId(record));
      var current = self.records.get(id) || {};
      self.records.set(id, Object.assign({}, current, { id: id, data: clone(record), base: clone(record) }));
    });
    (change.deletes || []).forEach(function (id) { self.records.delete(String(id)); });
    try { this.onRecordsChanged({ source: 'tab', upserts: clone(change.upserts || []), deletes: clone(change.deletes || []), records: this.getRecords() }); } catch (_) {}
  };

  SyncClient.prototype.pollOnce = async function (forceFull) {
    if (!this.ready || this.pollInFlight) return { skipped: true };
    this.pollInFlight = true;
    try {
      var full = !!forceFull || !this.lastFullReconcileAt || Date.now() - this.lastFullReconcileAt >= this.config.fullReconcileMs;
      var items = await this.fetchPagedItems(this.buildItemsUrl(full));
      var changes = this.applyItems(items, 'remote', full);
      if (full) this.lastFullReconcileAt = Date.now();
      this.emptyPolls = changes.upserts.length || changes.deletes.length ? 0 : this.emptyPolls + 1;
      this.backoffMs = 0;
      this.emitStatus('synced', changes.upserts.length || changes.deletes.length ? 'Changes received.' : 'Up to date.');
      return changes;
    } finally {
      this.pollInFlight = false;
    }
  };

  SyncClient.prototype.nextPollDelay = function () {
    if (global.document && global.document.visibilityState === 'hidden') return this.jitter(this.config.hiddenPollMs);
    if (this.backoffMs) return this.jitter(this.backoffMs);
    if (Date.now() < this.activeUntil || this.emptyPolls < 3) return this.jitter(this.config.activePollMs);
    return this.jitter(this.config.idlePollMs);
  };

  SyncClient.prototype.scheduleNextPoll = function (delay) {
    var self = this;
    clearTimeout(this.pollTimer);
    if (!this.started) return;
    this.pollTimer = setTimeout(function () { self.pollLoop(); }, Math.max(100, delay == null ? this.nextPollDelay() : delay));
  };

  SyncClient.prototype.pollLoop = async function () {
    if (!this.started) return;
    if (!this.tryLeadership()) {
      this.scheduleNextPoll(Math.min(5000, Math.round(this.config.leaderLeaseMs / 3)));
      return;
    }
    this.renewLeadership();
    if (global.navigator && global.navigator.onLine === false) {
      this.emitStatus('offline', 'Offline; waiting to reconnect.');

      await this.pollOnce(false);
    } catch (error) {

      var next = error && error.retryAfterMs || Math.min(this.config.maxBackoffMs, Math.max(this.config.activePollMs, (this.backoffMs || this.config.activePollMs) * 2));

      this.emitStatus(throttled ? 'throttled' : 'error', error.message || 'SharePoint polling failed.', error);

  SyncClient.prototype.handleOnline = function () {
    this.activeUntil = Date.now() + 30000;
    this.scheduleNextPoll(this.jitter(500));
  };

  SyncClient.prototype.handleVisibility = function () {
    if (global.document && global.document.visibilityState === 'visible') {
      this.activeUntil = Date.now() + 30000;
      this.scheduleNextPoll(this.jitter(500));
    }
  };

  SyncClient.prototype.start = async function () {
    if (!this.ready) await this.initialize();
    if (this.started) return this;
    this.started = true;
    this.setupChannel();
    global.addEventListener('pagehide', this.boundPageHide);
    global.addEventListener('online', this.boundOnline);
    global.document && global.document.addEventListener('visibilitychange', this.boundVisibility);
    this.activeUntil = Date.now() + 30000;
    if (this.tryLeadership()) {
      try { await this.pollOnce(true); } catch (error) { this.emitStatus('error', error.message || 'Initial SharePoint sync failed.', error); }
    }
    this.scheduleNextPoll(this.isLeader ? this.nextPollDelay() : Math.min(5000, Math.round(this.config.leaderLeaseMs / 3)));
    return this;
  };

  SyncClient.prototype.stop = function () {
    this.started = false;
    clearTimeout(this.pollTimer);
    this.pollTimer = 0;
    this.releaseLeadership();
    if (this.channel) this.channel.close();
    this.channel = null;
    global.removeEventListener('pagehide', this.boundPageHide);
    global.removeEventListener('online', this.boundOnline);
    global.document && global.document.removeEventListener('visibilitychange', this.boundVisibility);
  };

  SyncClient.prototype.getRecords = function () {
    return Array.from(this.records.values()).map(function (entry) { return clone(entry.data); });
  };

  SyncClient.prototype.getRecord = function (id) {
    var entry = this.records.get(String(id));
    return entry ? clone(entry.data) : null;
  };

  SyncClient.prototype.findServerItem = async function (recordId) {
    var filter = "$filter=Title eq '" + odataEscape(recordId) + "'&$orderby=Modified desc&$top=1";
    var items = await this.fetchPagedItems(this.listUrl() + '/items?$select=Id,Title,ItemType,DataJson,Modified&' + filter);
    var self = this;
    var item = items.find(function (candidate) { return candidate.ItemType === self.itemType; });
    return item ? this.parseItem(item) : null;
  };

  SyncClient.prototype.createServerRecord = async function (recordId, data) {
    var digest = await this.getDigest();
    var result;
    try {
      result = await this.request(this.listUrl() + '/items', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json;odata=verbose',
          'X-RequestDigest': digest,
          Prefer: 'return=representation'
        },
        body: JSON.stringify({
          __metadata: { type: this.entityType },
          Title: recordId,
          ItemType: this.itemType,
          DataJson: JSON.stringify(data)
        })
      });
    } catch (error) {
      var recovered = await this.findServerItem(recordId).catch(function () { return null; });
      if (recovered && recovered.data && recovered.data._forgeSync && data._forgeSync && recovered.data._forgeSync.operationId === data._forgeSync.operationId) return recovered;
      throw error;
    }
    var item = unwrap(result.payload);
    if (!item || !item.Id) item = await this.findServerItem(recordId);
    else item = { Id: item.Id, Title: item.Title || recordId, ItemType: this.itemType, DataJson: item.DataJson || JSON.stringify(data), Modified: item.Modified, __metadata: item.__metadata };
    var parsed = item && item.data ? item : this.parseItem(item);
    if (!parsed) throw new ForgeSyncError('SharePoint created the item but returned no usable representation.');
    parsed.data = clone(data);
    parsed.base = clone(data);
    return parsed;
  };

  SyncClient.prototype.updateServerRecord = async function (entry, data) {
    if (!entry || !entry.spId || !entry.etag) throw new ForgeSyncError('Cannot update a record without its SharePoint ID and exact ETag.');
    var digest = await this.getDigest();
    var result = await this.request(this.listUrl() + '/items(' + entry.spId + ')', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json;odata=verbose',
        'X-RequestDigest': digest,
        'X-HTTP-Method': 'MERGE',
        'IF-MATCH': entry.etag,
        Prefer: 'return=representation'
      },
      body: JSON.stringify({
        __metadata: { type: this.entityType },
        Title: String(this.getRecordId(data)),
        ItemType: this.itemType,
        DataJson: JSON.stringify(data)

    var self = this;
    return this.withRetry(async function () {
      var refreshed = await self.findServerItem(String(self.getRecordId(data)));
      if (!refreshed) throw new ForgeSyncError('Updated item is still propagating.', { status: 404 });
      refreshed.data = clone(data);
      refreshed.base = clone(data);
      return refreshed;
    });
  };

  SyncClient.prototype.resolveConflict = async function (entry, localData) {
    var server = await this.findServerItem(String(this.getRecordId(localData)));
    if (!server) return { record: localData, entry: null, conflicts: [] };
    var merged;
    if (this.mergeRecord) {
      merged = await this.mergeRecord(clone(entry && entry.base || {}), clone(localData), clone(server.data));
      if (!merged || !merged.record) merged = { record: merged, conflicts: [] };
    } else {
      merged = defaultThreeWayMerge(entry && entry.base || {}, localData, server.data);
    }
    return { record: merged.record, entry: server, conflicts: merged.conflicts || [] };
  };

  SyncClient.prototype.persist = async function (record, operationId) {
    var recordId = String(this.getRecordId(record));
    if (!recordId || recordId === 'undefined') throw new Error('Every synchronized record needs a stable ID.');
    var data = this.decorateRecord(record, operationId);
    var entry = this.records.get(recordId);
    if (!entry || !entry.spId || !entry.etag) entry = await this.findServerItem(recordId);
    if (!entry) {
      entry = await this.createServerRecord(recordId, data);
    } else {
      for (var attempt = 0; attempt < 3; attempt += 1) {
        try {
          entry = await this.updateServerRecord(entry, data);
          break;
        } catch (error) {
          if (!error || error.status !== 412 || attempt === 2) throw error;
          var resolved = await this.resolveConflict(entry, data);
          data = this.decorateRecord(resolved.record, operationId);
          entry = resolved.entry;
          if (resolved.conflicts.length) this.emitStatus('conflict', 'Concurrent edits were merged; review highlighted conflicts.', resolved.conflicts);
        }

    this.records.set(recordId, entry);
    this.activeUntil = Date.now() + 30000;
    this.broadcast('activity', { id: recordId });
    try { this.onRecordsChanged({ source: 'local', upserts: [clone(entry.data)], deletes: [], records: this.getRecords() }); } catch (_) {}
    if (this.started) this.scheduleNextPoll(this.jitter(500));
    return clone(entry.data);
  };

  SyncClient.prototype.drainRecordQueue = async function (recordId) {
    var queue = this.pendingWrites.get(recordId);
    if (!queue || queue.running) return;
    queue.running = true;
    var result;
    try {
      while (queue.latest) {
        var pending = queue.latest;
        queue.latest = null;
        result = await this.persist(pending.record, pending.operationId);
      }
      queue.waiters.forEach(function (waiter) { waiter.resolve(clone(result)); });

      queue.waiters.forEach(function (waiter) { waiter.reject(error); });
      this.emitStatus('error', error.message || 'SharePoint write failed.', error);
    } finally {
      this.pendingWrites.delete(recordId);
    }
  };

  SyncClient.prototype.save = function (record) {
    var self = this;
    if (!this.ready) return Promise.reject(new ForgeSyncError('ForgeSharePointSync is not initialized.'));
    var recordId = String(this.getRecordId(record));
    if (!recordId || recordId === 'undefined') return Promise.reject(new Error('Every synchronized record needs a stable ID.'));
    var operationId = this.clientId + ':' + (++this.operationSequence) + ':' + uuid();
    return new Promise(function (resolve, reject) {
      var queue = self.pendingWrites.get(recordId);

        self.pendingWrites.set(recordId, queue);

      queue.waiters.push({ resolve: resolve, reject: reject });

  SyncClient.prototype.syncNow = async function () {
    this.activeUntil = Date.now() + 30000;
    return this.pollOnce(false);

    }

            margin-bottom: 20px;
        }
        .edit-page-header h2 {
            margin: 0;
        }
        #item-form-container {
            max-height: 68vh;
            overflow-y: auto;
            padding-right: 15px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-group label {
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .form-group textarea {
            resize: vertical;
        }

        .conflict-section {
            margin-top: 15px;
            padding: 10px;
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            border-radius: 4px;
        }
        .conflict-section h4 {
            margin-top: 0;
            color: var(--warning-text);
        }

        .conflict-section pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background: #fff;
            padding: 5px;
            border-radius: 3px;
        }
        .form-actions {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        .form-actions-left,
        .form-actions-right {
            display: flex;
            gap: 10px;
        }

        /* Metrics placeholder */
        .metrics-placeholder {
            text-align: center;
            padding: 80px 20px;
            color: #6c757d;
        }
        .metrics-placeholder .icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .metrics-placeholder h2 {
            color: var(--primary-color);
            margin-bottom: 8px;
        }
    </style>
</head>
<body>    <div id="wct-unshipped-banner" style="display:none;"></div>
    <div class="container">
        <h1>tbl_SS_Actions</h1>
        <div id="sync-status">Initializing...</div>

        <div class="nav-tabs">
            <button type="button" class="nav-tab active" id="nav-dashboard" data-view="dashboard">Dashboard</button>
            <button type="button" class="nav-tab" id="nav-metrics" data-view="metrics">Metrics</button>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="view-dashboard" class="view active">
            <button type="button" id="add-new-btn" class="btn-add">Add New Item</button>

            <div class="filter-bar">
                <div class="filter-group search-group">
                    <label for="filter-search">Search</label>
                    <input type="text" id="filter-search" placeholder="Tracking ref, title, POC, shop, description...">
                </div>
                <div class="filter-group">
                    <label for="filter-status">Status</label>
                    <select id="filter-status"><option value="">All Statuses</option></select>
                </div>
                <div class="filter-group">
                    <label for="filter-priority">Priority</label>
                    <select id="filter-priority"><option value="">All Priorities</option></select>
                </div>
                <div class="filter-group">
                    <label for="filter-phase">Phase</label>
                    <select id="filter-phase"><option value="">All Phases</option></select>
                </div>
                <div class="filter-group">
                    <label for="filter-itemCategory">Category</label>
                    <select id="filter-itemCategory"><option value="">All Categories</option></select>
                </div>
                <div class="filter-group">
                    <label for="filter-procType">Proc Type</label>
                    <select id="filter-procType"><option value="">All Proc Types</option></select>
                </div>
                <div class="filter-group">
                    <label for="filter-assignEng">Assigned Engineer</label>
                    <select id="filter-assignEng"><option value="">All Engineers</option></select>
                </div>
                <div class="filter-actions">
                    <span class="ticket-count" id="ticket-count">0 of 0 tickets</span>
                    <button type="button" id="clear-filters-btn" class="btn-clear">Clear Filters</button>
                </div>
            </div>

            <div class="table-container">
                <table id="tbl_SS_Actions">
                    <thead>
                        <tr></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- METRICS VIEW -->
        <div id="view-metrics" class="view">
            <div class="metrics-placeholder">
                <div class="icon">📊</div>
                <h2>Metrics</h2>
                <p>Coming soon.</p>
            </div>
        </div>

        <!-- EDIT / ADD VIEW (full page, not a modal) -->
        <div id="view-edit" class="view">
            <button type="button" id="back-to-dashboard-btn" class="btn-back">&larr; Back to Dashboard</button>
            <div class="edit-page-header">
                <h2 id="form-title">Add Item</h2>
            </div>
            <div id="item-form-container">
                <div id="item-form" class="form-grid"></div>
                <div id="conflict-display" class="conflict-section" style="display:none;">
                    <h4>Resolve Conflicts</h4>
                    <p>This item has conflicting changes. Please review your version below and the server version before saving.</p>
                    <div id="conflict-details"></div>
                </div>
            </div>
            <div class="form-actions">
                <div class="form-actions-left">
                    <button type="button" id="remove-from-edit-btn" class="btn-remove" style="display:none;">Remove Item</button>
                </div>
                <div class="form-actions-right">
                    <button type="button" id="cancel-btn" class="btn-cancel">Cancel</button>
                    <button type="button" id="save-btn" class="btn-save">Save</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const tableHeaders = [
                'ID', 'TrackingRef', 'Status', 'Priority', 'OrigShop', 'Approved', 'Closed', 'Phase', 'System', 'TIpart',
                'TImodel', 'TInomen', 'TIcage', 'TIserial', 'ProbDesc', 'POCname', 'POCphone', 'POCemail', 'Createdby',
                'AssignEng', 'EngNotes', 'Resolution', 'RefTEI', 'RefICP', 'RefICPRev', 'TInotes', 'BenefitShop',
                'Reqname', 'Reqemail', 'Reqphone', 'DelayReason', 'ShopNameTag', 'ProcType', 'ICPno', 'ICPrevdate',
                'Cklist', 'LCPno', 'TEInst', 'TitleTicket', 'Interval', 'IntJust', 'WorkNotes', 'MUAperf', 'EngStatus',
                'QAperf', 'DelayDate', 'InWorkDate', 'delayDays', 'inWorkdays', 'LCPfuture', 'LCPinfolder', 'Cklistrefer',
                'ModelCatJustInt', 'PersDelayDays', 'FundDelayDays', 'BTDelayDays', 'ReqDelayDays', 'OthDelayDays',
                'LCPDelayDays', 'LCPinit', 'LCPcomp', 'LCPrej', 'StatusTicket', 'StUpdate', 'ECD', 'SERD', 'Acode', 'Rcode',
                'CPARstatus', 'CPARsubmit', 'LCPDate', 'noCPARreason', 'LCPSubmit', 'Attachments', 'cramuaTL', 'draftlcpvtTL',
                'btTL', 'revisedlcpTL', 'cparsubTL', 'localpassTL', 'cparmgrpassTL', 'chengpassTL', 'muaTool', 'externalLCPNotes',
                'CPARNotes', 'TEINotes', 'craChecklist', 'muaChecklist', 'lcgChecklist', "NMI'd", 'prevSub', 'NMIdBy',
                'awaitingStatus', 'nextTask', 'miscChecklist', 'CompletedBy', 'itemCategory', 'CompString'
            ];
            const formFields = tableHeaders;
            const personFields = ['POCname', 'Createdby', 'AssignEng', 'Reqname', 'CompletedBy', 'NMIdBy'];
            const longTextFields = [
                'ProbDesc', 'EngNotes', 'Resolution', 'TInotes', 'WorkNotes', 'StatusTicket', 'externalLCPNotes',
                'CPARNotes', 'TEINotes', 'DelayReason', 'IntJust', 'ModelCatJustInt', 'noCPARreason'
            ];

            // Columns shown on the dashboard (summary view). Full detail is edited on its own page.
            const dashboardColumns = [
                'TrackingRef', 'Status', 'Priority', 'Phase', 'itemCategory', 'ProcType',
                'TitleTicket', 'AssignEng', 'POCname', 'ShopNameTag', 'Approved', 'Closed', 'ECD'
            ];

            // Fields with a fixed, filterable dropdown on the dashboard.
            const filterFieldMap = {
                status: 'Status',
                priority: 'Priority',
                phase: 'Phase',
                itemCategory: 'itemCategory',
                procType: 'ProcType',
                assignEng: 'AssignEng'
            };
            const searchFields = ['TrackingRef', 'TitleTicket', 'ProbDesc', 'POCname', 'AssignEng', 'ShopNameTag', 'TInomen', 'TImodel', 'Resolution'];

            const tableHead = document.querySelector('#tbl_SS_Actions thead tr');
            const tableBody = document.querySelector('#tbl_SS_Actions tbody');
            const formGrid = document.querySelector('#item-form');
            const addNewBtn = document.getElementById('add-new-btn');
            const formTitle = document.getElementById('form-title');
            const backToDashboardBtn = document.getElementById('back-to-dashboard-btn');
            const cancelBtn = document.getElementById('cancel-btn');
            const saveBtn = document.getElementById('save-btn');
            const removeFromEditBtn = document.getElementById('remove-from-edit-btn');
            const syncStatusEl = document.getElementById('sync-status');
            const conflictDisplay = document.getElementById('conflict-display');
            const conflictDetails = document.getElementById('conflict-details');
            const ticketCountEl = document.getElementById('ticket-count');
            const clearFiltersBtn = document.getElementById('clear-filters-btn');
            const searchInput = document.getElementById('filter-search');

            const navTabs = document.querySelectorAll('.nav-tab');
            const views = {
                dashboard: document.getElementById('view-dashboard'),
                metrics: document.getElementById('view-metrics'),
                edit: document.getElementById('view-edit')
            };

            let allItems = new Map();
            let editingItemId = null;
            let syncClient;
            let peopleClient;
            let filters = { search: '', status: '', priority: '', phase: '', itemCategory: '', procType: '', assignEng: '' };

            function switchView(viewName) {
                Object.keys(views).forEach(key => views[key].classList.toggle('active', key === viewName));
                navTabs.forEach(tab => tab.classList.toggle('active', tab.dataset.view === viewName));
                if (viewName === 'dashboard') {
                    editingItemId = null;
                }
            }

            function cssSlug(value) {
                return String(value || '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            }

            function getFieldText(item, field) {
                const value = item[field];
                if (personFields.includes(field) && value && typeof value === 'object') {
                    return value.displayName || '';
                }
                return value == null ? '' : String(value);
            }

            function onRecordsChanged({ source, upserts, deletes }) {
                deletes.forEach(deletedId => allItems.delete(deletedId));
                upserts.forEach(record => allItems.set(record.ID, record));
                populateFilterOptions();
                renderDashboard();
            }
            function onStatusChange({ state, message }) {
                syncStatusEl.textContent = `Sync Status: ${message}`;
                syncStatusEl.style.backgroundColor = state === 'error' ? '#dc3545' : (state === 'ready' ? '#28a745' : '#6c757d');
            }

            function populateFilterOptions() {
                const itemsArray = Array.from(allItems.values());
                Object.keys(filterFieldMap).forEach(filterKey => {
                    const field = filterFieldMap[filterKey];
                    const select = document.getElementById(`filter-${filterKey}`);
                    const currentValue = select.value;
                    const distinctValues = new Set();
                    itemsArray.forEach(item => {
                        const text = getFieldText(item, field).trim();
                        if (text) distinctValues.add(text);
                    });
                    const sorted = Array.from(distinctValues).sort((a, b) => a.localeCompare(b));
                    const placeholderOption = select.options[0];
                    select.innerHTML = '';
                    select.appendChild(placeholderOption);
                    sorted.forEach(value => {
                        const option = document.createElement('option');
                        option.value = value;
                        option.textContent = value;
                        select.appendChild(option);
                    });
                    if (sorted.includes(currentValue)) select.value = currentValue;
                });
            }

            function matchesFilters(item) {
                for (const filterKey of Object.keys(filterFieldMap)) {
                    const activeValue = filters[filterKey];
                    if (activeValue && getFieldText(item, filterFieldMap[filterKey]) !== activeValue) return false;
                }
                if (filters.search) {
                    const haystack = searchFields.map(field => getFieldText(item, field)).join(' ').toLowerCase();
                    if (!haystack.includes(filters.search)) return false;
                }
                return true;
            }

            function renderDashboard() {
                const fullList = Array.from(allItems.values());
                const filtered = fullList.filter(matchesFilters);
                ticketCountEl.textContent = `${filtered.length} of ${fullList.length} tickets`;

                tableBody.innerHTML = '';
                if (filtered.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="${dashboardColumns.length + 1}" style="text-align:center;">No tickets match the current filters.</td></tr>`;
                    return;
                }
                filtered.sort((a, b) => (a.TrackingRef || '').localeCompare(b.TrackingRef || ''));
                filtered.forEach(item => {
                    const row = document.createElement('tr');
                    row.dataset.id = item.ID;
                    if (item._forgeConflicts) {
                        row.classList.add('has-conflict');
                    }

                    let rowHTML = '';
                    dashboardColumns.forEach(field => {
                        const displayValue = getFieldText(item, field);
                        if (field === 'Status') {
                            rowHTML += `<td><span class="status-pill status-${cssSlug(displayValue)}">${displayValue || '—'}</span></td>`;
                        } else if (field === 'Priority') {
                            rowHTML += `<td><span class="priority-pill priority-${cssSlug(displayValue)}">${displayValue || '—'}</span></td>`;
                        } else {
                            rowHTML += `<td title="${displayValue}">${displayValue}</td>`;
                        }
                    });
                    rowHTML += `
                        <td class="actions">
                            <button type="button" class="btn-edit" data-id="${item.ID}">Edit</button>
                            <button type="button" class="btn-remove" data-id="${item.ID}">Remove</button>
                        </td>`;
                    row.innerHTML = rowHTML;
                    tableBody.appendChild(row);
                });
            }

            function openEditPage(title, item = null) {
                formTitle.textContent = title;
                conflictDisplay.style.display = 'none';
                formFields.forEach(field => {
                    const input = document.getElementById(`field-${field}`);
                    input.value = '';
                    if (item) {
                       const value = item[field];
                       if (personFields.includes(field) && value && typeof value === 'object') {
                           input.value = value.displayName || '';
                           input.dataset.person = JSON.stringify(value);
                       } else {
                           input.value = value || '';
                       }
                    } else {
                        delete input.dataset.person;
                    }
                });
                if (item) {
                    editingItemId = item.ID;
                    document.getElementById('field-ID').readOnly = true;
                    removeFromEditBtn.style.display = '';
                    if (item._forgeConflicts) {
                        conflictDisplay.style.display = 'block';
                        conflictDetails.innerHTML = `<pre>${JSON.stringify(item._forgeConflicts, null, 2)}</pre>`;
                    }
                } else {
                    editingItemId = null;
                    const newId = crypto.randomUUID();
                    document.getElementById('field-ID').value = newId;
                    document.getElementById('field-ID').readOnly = true;
                    removeFromEditBtn.style.display = 'none';
                }
                switchView('edit');
                document.getElementById('item-form-container').scrollTop = 0;
            }

            async function handleSave() {
                const id = document.getElementById('field-ID').value;
                let record = allItems.get(id) || { ID: id };
                formFields.forEach(field => {
                    const input = document.getElementById(`field-${field}`);
                    if (personFields.includes(field) && input.dataset.person) {
                        record[field] = JSON.parse(input.dataset.person);
                    } else {
                        record[field] = input.value;
                    }
                });

                // Clear conflicts on save
                delete record._forgeConflicts;

                try {
                    await syncClient.save(record);
                } catch(e) {
                    console.error("Save failed:", e);
                    alert("Failed to save record. See console for details.");
                    return;
                }
                switchView('dashboard');
            }
            function handleEdit(id) {
                const item = allItems.get(id);
                if (item) {
                    openEditPage('Edit Item', item);
                }
            }
            async function handleRemove(id) {
                if (confirm('Are you sure you want to remove this item?')) {
                     try {
                        await syncClient.remove(id);
                    } catch(e) {
                        console.error("Remove failed:", e);
                        alert("Failed to remove record. See console for details.");
                    }
                }
            }
            async function handleRemoveFromEdit() {
                if (!editingItemId) return;
                if (confirm('Are you sure you want to remove this item?')) {
                    try {
                        await syncClient.remove(editingItemId);
                        switchView('dashboard');
                    } catch(e) {
                        console.error("Remove failed:", e);
                        alert("Failed to remove record. See console for details.");
                    }
                }
            }

            async function init() {
                formGrid.innerHTML = formFields.map(field => {
                    const isLongText = longTextFields.includes(field);
                    const control = isLongText
                        ? `<textarea id="field-${field}" name="${field}" rows="4"></textarea>`
                        : `<input type="text" id="field-${field}" name="${field}">`;
                    return `
                        <div class="form-group${isLongText ? ' full-width' : ''}">
                            <label for="field-${field}">${field}</label>
                            ${control}
                        </div>
                    `;
                }).join('');
                tableHead.innerHTML = dashboardColumns.map(h => `<th>${h}</th>`).join('') + '<th>Actions</th>';

                navTabs.forEach(tab => {
                    tab.addEventListener('click', () => switchView(tab.dataset.view));
                });

                addNewBtn.addEventListener('click', () => openEditPage('Add New Item'));
                saveBtn.addEventListener('click', handleSave);
                cancelBtn.addEventListener('click', () => switchView('dashboard'));
                backToDashboardBtn.addEventListener('click', () => switchView('dashboard'));
                removeFromEditBtn.addEventListener('click', handleRemoveFromEdit);

                tableBody.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('btn-edit')) {
                        handleEdit(target.dataset.id);
                    } else if (target.classList.contains('btn-remove')) {
                        handleRemove(target.dataset.id);
                    }
                });

                searchInput.addEventListener('input', (event) => {
                    filters.search = event.target.value.trim().toLowerCase();
                    renderDashboard();
                });
                Object.keys(filterFieldMap).forEach(filterKey => {
                    document.getElementById(`filter-${filterKey}`).addEventListener('change', (event) => {
                        filters[filterKey] = event.target.value;
                        renderDashboard();
                    });
                });
                clearFiltersBtn.addEventListener('click', () => {
                    filters = { search: '', status: '', priority: '', phase: '', itemCategory: '', procType: '', assignEng: '' };
                    searchInput.value = '';
                    Object.keys(filterFieldMap).forEach(filterKey => {
                        document.getElementById(`filter-${filterKey}`).value = '';
                    });
                    renderDashboard();
                });

                try {
                    peopleClient = await ForgeSharePointSync.createPeopleClient();
                    personFields.forEach(field => {
                        const input = document.getElementById(`field-${field}`);
                        if(input) {
                            peopleClient.attachAutocomplete(input, {
                                onSelect: (person) => {
                                    input.dataset.person = JSON.stringify(person);
                                }
                            });
                        }
                    });
                } catch(e) {
                    console.error("Could not initialize People Client:", e);
                    onStatusChange({state: 'error', message: 'People Client Failed'});
                }
                try {
                    syncClient = await ForgeSharePointSync.create({
                        listTitle: 'tbl_SS_Actions_Data_a1b2c3d4e5',
                        itemType: 'tbl_SS_Actions_Item',
                        getRecordId: (record) => record.ID,
                        onRecordsChanged,
                        onStatusChange,
                    });
                    await syncClient.start();
                } catch(e) {
                    console.error("Could not initialize SharePoint Sync:", e);
                    onStatusChange({state: 'error', message: 'Sync Failed To Start'});
                }

                populateFilterOptions();
                renderDashboard();
            }
            init();
        });
    </script>

</body>
